<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Page de test : noindex = les moteurs de recherche ne l'indexent pas. À retirer à la mise en ligne définitive. -->
<meta name="robots" content="noindex">
<title>Romain Mesdon — Marketing &amp; communication</title>
<style>
  :root { --bg:#fafaf7; --fg:#161616; --muted:#5c5c57; --accent:#d4401f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#f2f2ee; --muted:#a3a39c; --accent:#ff6a45; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: var(--bg); color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
  }
  main { max-width: 640px; }
  .kicker {
    font-family: system-ui, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; font-size: .8rem; color: var(--muted); margin: 0 0 16px;
  }
  h1 { font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.05; margin: 0 0 20px; }
  .lead { font-size: 1.2rem; line-height: 1.55; color: var(--muted); margin: 0 0 28px; }
  .cta {
    font-family: system-ui, sans-serif; display: inline-block; padding: 12px 20px;
    border: 2px solid var(--accent); color: var(--accent);
    text-decoration: none; font-weight: 600;
  }
  .cta:hover { background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<main>
  <p class="kicker">Marketing &amp; communication</p>
  <h1>Romain Mesdon</h1>
  <!-- Texte provisoire (positionnement A1) : à affiner -->
  <p class="lead">Je transforme les enjeux business en dispositifs marketing opérationnels, de la stratégie de marque au déploiement.</p>
  <a class="cta" href="https://www.linkedin.com/in/romain-mesdon-%F0%9F%8E%88-2373228b/">Me contacter sur LinkedIn</a>
</main>
</body>
</html>
